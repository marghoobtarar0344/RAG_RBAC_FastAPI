version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
  auth_service:
    build: ./auth
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:mysecretpassword@postgres:5432/auth_db"
  
    networks:
      - app-network

  profile_service:
    build: ./profile
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:mysecretpassword@postgres:5432/auth_db"
    volumes:
      - ./policy.polar:/app/policy.polar:ro  # Mount as read-only
    networks:
      - app-network

  rag_service:
    build: ./rag
    ports:
      - "8003:8003"
    # environment:
    #   - VECTOR_DB_PATH=/chroma_db
    env_file:
      - .env
    volumes:
      - ./policy.polar:/app/policy.polar:ro  # Mount as read-only
    
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:mysecretpassword@postgres:5432/auth_db"
    networks:
      - app-network

  nginx:
    image: nginx:latest
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth_service
      # - profile_service
      # - rag_service
    networks:
      - app-network

volumes:
  postgres_data:
networks:
  app-network:
    driver: bridge